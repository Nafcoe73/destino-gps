plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.sinergias.destinogps'
    compileSdk 36

    defaultConfig {
        applicationId 'pt.sinergias.destinogps'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Assinado com a chave de debug para poderes instalar logo o APK de release.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sem dependências: só o Android puro. APK final ~30-60 KB.
dependencies {
}
